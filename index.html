<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0f" />
  <title>ZERO17 Coach v0.4</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <h1>ZERO<span class="red">17</span> COACH</h1>
  <div class="subtitle">Versão 0.4 — cadastro e gerenciamento de alunos</div>
  <div class="toolbar">
    <div class="filters">
      <select id="timeSelect" aria-label="Horário"></select>
      <button id="addStudentTop" class="btn btn-red">+ Cadastrar aluno</button>
    </div>
    <div id="studentCount" class="count"></div>
  </div>
  <main id="studentGrid" class="grid"></main>
</div>

<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head"><h2 id="drawerTitle">Editar treino</h2><button id="closeDrawer" class="close">×</button></div>
  <div class="drawer-body"><div id="workoutTitleWrap" class="workout-title"><input id="workoutTitleInput" placeholder="Nome do treino"></div><div id="editList"></div><button id="addExercise" class="btn">+ Adicionar exercício</button></div>
  <div class="drawer-footer"><button id="cancelEdit" class="btn">Cancelar</button><button id="saveEdit" class="btn btn-red">Salvar alterações</button></div>
</aside>

<aside id="studentDrawer" class="drawer">
  <div class="drawer-head"><h2 id="studentDrawerTitle">Cadastrar aluno</h2><button id="closeStudentDrawer" class="close">×</button></div>
  <div class="drawer-body">
    <div class="manage-form">
      <div class="field"><label for="studentNameInput">Nome do aluno</label><input id="studentNameInput" placeholder="Ex.: Maria"></div>
      <div class="field"><label for="studentTimeInput">Horário</label><input id="studentTimeInput" type="time" step="900"></div>
      <div class="small-note">O aluno será criado com os cinco dias da semana. Depois, abra cada dia e use “Editar treino” para cadastrar os exercícios.</div>
    </div>
    <div id="deleteStudentZone" class="danger-zone" style="display:none"><button id="deleteStudent" class="btn btn-danger">Excluir aluno</button></div>
  </div>
  <div class="drawer-footer"><button id="cancelStudent" class="btn">Cancelar</button><button id="saveStudent" class="btn btn-red">Salvar aluno</button></div>
</aside>

  <script src="script.js"></script>
</body>
</html>
